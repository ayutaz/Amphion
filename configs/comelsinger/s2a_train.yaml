# S2A Training Configuration (Paper Section IV-B confirmed values)
model:
  pitch_vocab_size: 129
  temperature: 0.07

training:
  seed: 42
  max_epochs: 100
  batch_size: 32
  k_s: 8
  gradient_clip: 1.0
  precision: bf16
  log_interval: 100
  save_interval: 10  # epochs
  val_interval: 10

optimizer:
  type: AdamW
  lr: 1.0e-5
  weight_decay: 0.01

scheduler:
  type: inverse_sqrt
  warmup_steps: 1000

loss:
  lambda_cl: 0.5
  lambda_scl: 1.0
  lambda_fcl: 0.1
  lambda_svt: 0.5
  lambda_mask: 0.3
  lambda_seg: 3.0
  lambda_dur: 5.0
  delta: 0.5
  tau: 0.07

lora:
  r: 16
  alpha: 32
  target_modules: ["q_proj", "v_proj"]
  dropout: 0.05
  modules_to_save: ["pitch_emb"]

data:
  data_dir: data/preprocessed
  num_workers: 4

checkpoint:
  output_dir: checkpoints/s2a
  svt_checkpoint: checkpoints/svt/svt_best.pt

pretrained:
  s2a_path: null  # HuggingFace cache path, set at runtime
